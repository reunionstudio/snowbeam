        <path d="M181 110L150 399 M331 110L362 399" fill="none" stroke="url(#snowbeam-edge)" stroke-width="5" stroke-linecap="round"/>
        <path d="M206 111L191 384 M231 112L226 366 M281 112L286 366 M306 111L321 384" fill="none" stroke="#a2edfa" stroke-width="2" opacity=".18"/>
        <ellipse cx="256" cy="110" rx="75" ry="15" fill="none" stroke="#a2edfa" stroke-width="4" opacity=".8"/>
      </g>
      <g id="snowbeam-person" opacity="1" transform="translate(0 0)" fill="url(#snowbeam-light)">

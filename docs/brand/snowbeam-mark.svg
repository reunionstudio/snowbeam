<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="snowbeam-title snowbeam-desc">
      <title id="snowbeam-title">Snowbeam</title>
      <desc id="snowbeam-desc">A standing person enveloped by an icy blue transporter beam; after they vanish, snowflakes drift down.</desc>
      <defs>
      <linearGradient id="snowbeam-beam-fill" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#97edff" stop-opacity=".05"/>
        <stop offset=".5" stop-color="#62d8ef" stop-opacity=".24"/>
        <stop offset="1" stop-color="#63d7ed" stop-opacity=".1"/>
      </linearGradient>
      <linearGradient id="snowbeam-edge" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#a2edfa" stop-opacity=".25"/>
        <stop offset=".55" stop-color="#a2edfa"/>
        <stop offset="1" stop-color="#a2edfa" stop-opacity=".3"/>
      </linearGradient>
      <linearGradient id="snowbeam-light" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#edfcff"/><stop offset="1" stop-color="#c2eff5"/>
      </linearGradient>
    </defs>


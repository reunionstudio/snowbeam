[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowbeam"
version = "0.1.0"
description = "Your Snowflake accounts, connections, and token expirations. In one place."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Reunion Studio"}]
dependencies = ["textual>=6.12,<7", "tomlkit>=0.13,<1", "platformdirs>=4,<5"]

[project.scripts]
snowbeam = "snowbeam.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "build>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
